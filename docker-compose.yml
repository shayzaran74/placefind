services:
  # ── API + Dashboard ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runner
    container_name: placefind_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/placefind_db
      REDIS_URI: redis://redis:6379
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PLACES_PROVIDER: ${PLACES_PROVIDER:-maps_scraper}
      PLACES_FALLBACK_PROVIDERS: ${PLACES_FALLBACK_PROVIDERS:-outscraper,apify}
      MAPS_LOCALE: ${MAPS_LOCALE:-en}
      OUTSCRAPER_API_KEY: ${OUTSCRAPER_API_KEY:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-compass/crawler-google-places}
      WEBP_QUALITY: ${WEBP_QUALITY:-85}
      WEBP_MAX_WIDTH: ${WEBP_MAX_WIDTH:-1200}
      UPLOADS_DIR: /app/uploads/images
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      ALLOW_MOCK_DATA: ${ALLOW_MOCK_DATA:-true}
    volumes:
      - uploads_data:/app/uploads/images
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Scraper workers (Playwright + WebP conversion) ─────────────────────────
  worker:
    build:
      context: .
      target: worker
    container_name: placefind_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/placefind_db
      REDIS_URI: redis://redis:6379
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      WEBP_QUALITY: ${WEBP_QUALITY:-85}
      WEBP_MAX_WIDTH: ${WEBP_MAX_WIDTH:-1200}
      UPLOADS_DIR: /app/uploads/images
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      ALLOW_MOCK_DATA: ${ALLOW_MOCK_DATA:-true}
      PLACES_PROVIDER: ${PLACES_PROVIDER:-maps_scraper}
      PLACES_FALLBACK_PROVIDERS: ${PLACES_FALLBACK_PROVIDERS:-outscraper,apify}
      MAPS_LOCALE: ${MAPS_LOCALE:-en}
      OUTSCRAPER_API_KEY: ${OUTSCRAPER_API_KEY:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-compass/crawler-google-places}
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-2}
      # Anti-ban pacing for the Google Maps scraper.
      SCRAPER_MIN_DELAY_MS: ${SCRAPER_MIN_DELAY_MS:-2000}
      SCRAPER_MAX_DELAY_MS: ${SCRAPER_MAX_DELAY_MS:-3000}
      SCRAPER_MAX_SCROLLS: ${SCRAPER_MAX_SCROLLS:-15}
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      SCRAPER_RATE_LIMIT_MAX: ${SCRAPER_RATE_LIMIT_MAX:-15}
      SCRAPER_RATE_LIMIT_DURATION_MS: ${SCRAPER_RATE_LIMIT_DURATION_MS:-60000}
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
      # Chromium ships in the worker image; playwright-core needs its path.
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium-browser
    volumes:
      - uploads_data:/app/uploads/images
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── MongoDB document store (2dsphere GEO index) ────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: placefind_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis task broker ──────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: placefind_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
  redis_data:
  uploads_data:
